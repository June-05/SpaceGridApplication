<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · SpaceGrid</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body class="card-page">
  <!--
    LOGIN  →  AuthController.login   POST /api/auth/login   (form fields: username, password)
    On success: go back to ?next= if present, otherwise to the user's dashboard (auth.home).
  -->
  <main class="card">
    <h1>SpaceGrid</h1>
    <form id="loginForm" novalidate>
      <p>Default password: password123</p>
      <p>Landlord usernames: maria.santos jose.reyes</p>
      <p>Renter usernames: ana.cruz paolo.garcia liza.mendoza</p>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
      <p id="error" class="error" aria-live="polite"></p>
    </form>
    <p><a href="/register.html">Create an account</a></p>
  </main>

  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
