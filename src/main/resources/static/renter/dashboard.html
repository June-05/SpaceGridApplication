<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Leases · SpaceGrid</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/zones.css">
    <!-- Links directly to your updated folder path -->
    <link rel="stylesheet" href="/css/renter-css/dashboard.css">
</head>
<body class="dashboard-page">
  <header class="topbar">
    <div class="titles">
      <h1>SpaceGrid</h1>
      <p class="subtitle">Renter Workspace</p>
    </div>
    <div class="topbar-actions">
      <a href="/" class="btn btn-primary">Browse spaces</a>
      <a href="/requests.html" class="btn">My requests</a>
      <button id="btnLogout" class="btn" type="button">Log out</button>
    </div>
  </header>

  <main class="container">
    <section class="section-header">
      <h2>My Active Leases</h2>
    </section>

    <!-- Isolated search bar container -->
    <div class="dashboard-search-container">
      <input 
        type="text" 
        id="leaseSearchInput" 
        class="search-input" 
        placeholder="Search property or unit..."
      />
    </div>

    <!-- Active Leases Grid -->
    <div id="leases" class="card-grid">
      <!-- Dynamic content from renter-dashboard.js -->
    </div>
  </main>

  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/format.js"></script>
  <script src="/js/pages/renter-dashboard.js"></script>
</body>
</html>
