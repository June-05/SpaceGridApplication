<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property · SpaceGrid</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body class="card-page">
  <!--
    ADD / EDIT PROPERTY  (no ?id = add, ?id=5 = edit)
      GET  /api/properties/{id}            fill the form when editing
      POST /api/properties                 add      (form fields below)
      PUT  /api/properties/{id}            edit     (same fields)
      POST /api/properties/{id}/publish    POST /api/properties/{id}/archive
    Form field names: name, address, type, description, exactSize (true/false), areaSqm, sizeDescription
    Script: js/pages/property-form.js
  -->
  <header class="topbar">
    <a href="/landlord/dashboard.html" class="back-link">← Dashboard</a>
    <div class="titles">
      <h1 id="pageTitle">Property Form</h1>
      <p class="subtitle">Configure and manage property specifications</p>
    </div>
    <div class="topbar-actions">
      <button id="btnLogout" class="btn" type="button">Log out</button>
    </div>
  </header>

  <main class="card">
    <form id="propertyForm" novalidate>
      <label class="field">
        <span>Property Name</span>
        <input name="name" id="name" placeholder="e.g. Sunset Apartments" required>
      </label>

      <label class="field">
        <span>Property Type</span>
        <select name="type" id="type" required>
          <option value="APARTMENT">Apartment</option>
          <option value="CONDOMINIUM">Condominium</option>
          <option value="TOWNHOUSE">Townhouse</option>
          <option value="COMMERCIAL">Commercial</option>
          <option value="NIGHT_MARKET">Night Market</option>
          <option value="OPEN_SPACE">Open Space</option>
        </select>
      </label>

      <label class="field">
        <span>Address</span>
        <textarea name="address" id="address" rows="3" placeholder="Full street address..." required></textarea>
      </label>

      <label class="field">
        <span>Description</span>
        <textarea name="description" id="description" rows="3" placeholder="Brief overview of the property..."></textarea>
      </label>

      <label class="field">
        <span>Size Description</span>
        <input name="sizeDescription" id="sizeDescription" placeholder="e.g. 3 Storey Building, 12 Units">
      </label>

      <label class="field">
        <span>Area in sqm (optional)</span>
        <input name="areaSqm" id="areaSqm" type="number" min="0" step="0.01" placeholder="e.g. 450.00">
      </label>

      <label class="check">
        <input name="exactSize" id="exactSize" type="checkbox"> Exact measurement confirmed
      </label>

      <button id="btnSave" class="btn btn-primary btn-block" type="submit">Save Property</button>
    </form>

    <div id="statusActions" class="status-actions">
      <h3>Publishing Actions</h3>
      <div class="button-group">
        <button id="btnPublish" class="btn btn-success" type="button">Publish Property</button>
        <button id="btnArchive" class="btn btn-danger" type="button">Archive Property</button>
      </div>
    </div>
  </main>

  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/pages/property-form.js"></script>
</body>
</html>
