<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · SpaceGrid</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body class="card-page">
  <!--
    REGISTER  →  AuthController.register   POST /api/auth/register
    Form fields: username, password, fullName, role (LANDLORD / RENTER), email and phone (optional).
  -->
  <main class="card">
    <h1>SpaceGrid</h1>
    <h2>Create an Account</h2>
    
    <form id="registerForm" novalidate>
      <label class="field">
        <span>Full Name</span>
        <input name="fullName" placeholder="e.g. Maria Santos" required>
      </label>

      <label class="field">
        <span>Email (optional)</span>
        <input name="email" type="email" autocomplete="email" placeholder="e.g. maria@example.com">
      </label>

      <label class="field">
        <span>Phone (optional)</span>
        <input name="phone" type="tel" autocomplete="tel" placeholder="e.g. +63 917 555 0101">
      </label>
      <p class="subtitle">Renters need both before they can ask to lease a unit. You can add them then.</p>

      <label class="field">
        <span>Username</span>
        <input name="username" autocomplete="username" placeholder="Choose a username" required>
      </label>

      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="new-password" placeholder="••••••••" required>
      </label>

      <label class="field">
        <span>Account Role</span>
        <select name="role" required>
          <option value="LANDLORD">Landlord</option>
          <option value="RENTER">Renter</option>
        </select>
      </label>

      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
      <p id="error" class="error" aria-live="polite"></p>
    </form>

    <p>Already have an account? <a href="/login.html">Log in</a></p>
  </main>

  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/pages/register.js"></script>
</body>
</html>
