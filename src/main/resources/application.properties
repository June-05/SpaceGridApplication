# --- App ---
spring.application.name=SpaceGrid
server.port=8080

# --- Database: XAMPP (MariaDB), user root, no password ---
spring.datasource.url=jdbc:mysql://localhost:3307/spacegrid_db?serverTimezone=Asia/Manila&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Never run SQL scripts automatically (database/spacegrid_db.sql is run by hand in MySQL Workbench)
spring.sql.init.mode=never

# --- Login session (SessionManager) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# --- Logging: show this app's debug messages while developing ---
logging.level.com.techhub.spacegridapplication=DEBUG
